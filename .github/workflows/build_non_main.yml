name: build-non-main
run-name: Build the game
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - 'main'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: fetch locked dependencies and Mathlib cache
        run: lake exe cache get
      - name: build game
        run: |
          lake build
          lake build GameServer

      - name: verify game and tactic progression
        run: |
          lake test
          node scripts/check-curriculum.mjs
          pwsh -File scripts/test-package-game.ps1
